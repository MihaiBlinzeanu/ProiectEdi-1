<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecondBrain</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --paper: oklch(0.977 0.006 95);
  --paper-2: oklch(0.955 0.008 90);
  --card: oklch(0.994 0.003 95);
  --ink: oklch(0.27 0.018 250);
  --ink-soft: oklch(0.44 0.02 250);
  --ink-faint: oklch(0.60 0.015 250);
  --pine: oklch(0.46 0.072 185);
  --pine-hover: oklch(0.40 0.075 185);
  --pine-soft: oklch(0.46 0.072 185 / 0.08);
  --ochre: oklch(0.66 0.105 72);
  --ochre-soft: oklch(0.66 0.105 72 / 0.12);
  --ochre-text: oklch(0.50 0.10 66);
  --border: oklch(0.90 0.01 250);
  --border-soft: oklch(0.93 0.008 250);
  --danger: oklch(0.55 0.15 28);
  --font-read: 'Newsreader', Georgia, serif;
  --font-ui: 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --radius: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

body {
  font-family: var(--font-ui);
  background: var(--paper);
  color: var(--ink);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(oklch(0.5 0.02 250 / 0.025) 1px, transparent 1px);
  background-size: 22px 22px;
}

.app { display: grid; grid-template-columns: 264px 1fr; min-height: 100vh; }

/* ---------- Sidebar ---------- */
.side {
  border-right: 1px solid var(--border);
  background: var(--paper-2);
  padding: 26px 20px;
  display: flex; flex-direction: column; gap: 26px;
}
.brand { display: flex; align-items: center; gap: 11px; }
.brand .mark {
  width: 34px; height: 34px; border-radius: 9px;
  background: var(--pine); position: relative; flex: none;
  box-shadow: 0 2px 8px oklch(0.46 0.072 185 / 0.3);
}
.brand .mark::before,
.brand .mark::after {
  content: ''; position: absolute; border-radius: 50%;
}
.brand .mark::before { inset: 8px; border: 2px solid var(--paper); border-right-color: transparent; transform: rotate(-20deg); }
.brand .mark::after { width: 6px; height: 6px; background: var(--ochre); top: 13px; left: 14px; }
.brand .name { font-family: var(--font-read); font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.brand .name b { color: var(--pine); font-weight: 600; }
.brand .sub { display:block; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); margin-top: 1px; }

.side h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-faint); font-weight: 600; margin-bottom: 12px; }
.corpus { display: flex; flex-direction: column; gap: 3px; }
.corpus a {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 11px; border-radius: 9px; text-decoration: none;
  color: var(--ink-soft); font-size: 14px; font-weight: 500;
  transition: all 0.2s ease;
}
.corpus a.active { background: var(--pine-soft); color: var(--pine); }
.corpus a:hover:not(.active) { background: oklch(0.5 0.02 250 / 0.05); transform: translateX(3px); }
.corpus .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pine); opacity: 0.7; flex-shrink: 0; }
.corpus .n { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); }

.side .actions { display: flex; flex-direction: column; gap: 8px; }
.side .actions button {
  width: 100%; padding: 10px 14px; border: 1px solid var(--border);
  border-radius: 10px; background: var(--card); color: var(--ink-soft);
  font-family: var(--font-ui); font-size: 13px; font-weight: 500;
  cursor: pointer; display: flex; align-items: center; gap: 8px;
  transition: all 0.2s ease;
}
.side .actions button:hover { border-color: var(--pine); color: var(--pine); background: var(--pine-soft); transform: translateY(-1px); box-shadow: 0 3px 10px oklch(0.3 0.02 250 / 0.06); }
.side .actions button:active { transform: translateY(0); }
.side .actions button .ico { font-size: 16px; }

.side .foot { margin-top: auto; font-size: 12px; color: var(--ink-faint); line-height: 1.5; }
.side .foot .grounded { display:inline-flex; align-items:center; gap:6px; color: var(--pine); font-weight: 600; }
.side .foot .grounded::before { content:''; width:7px; height:7px; border-radius:50%; background: var(--pine); }

/* ---------- Main ---------- */
.main { display: flex; flex-direction: column; height: 100vh; }
.topbar {
  padding: 12px 40px; border-bottom: 1px solid var(--border-soft);
  display: flex; align-items: center; justify-content: space-between;
  background: oklch(0.977 0.006 95 / 0.8); backdrop-filter: blur(6px);
}
.topbar .ctx { font-size: 13px; color: var(--ink-faint); }
.topbar .ctx b { color: var(--ink-soft); font-weight: 600; }
.topbar .actions { display: flex; gap: 8px; align-items: center; }

.topbar .btn {
  font-family: var(--font-ui); font-size: 14px; font-weight: 600;
  padding: 10px 20px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--card); color: var(--ink-soft); cursor: pointer;
  transition: all 0.2s ease;
}
.topbar .btn:hover { border-color: var(--pine); color: var(--pine); background: var(--pine-soft); }
.topbar .btn-primary { background: var(--pine); color: white; border-color: var(--pine); }
.topbar .btn-primary:hover { background: var(--pine-hover); }
.topbar .btn-outline { background: transparent; }
.topbar .btn .ico { margin-right: 6px; }

.thread { flex: 1; overflow-y: auto; padding: 40px 40px 20px; }
.turn { max-width: 760px; margin: 0 auto 36px; animation: fadeSlideUp 0.35s ease; }

.q { display: flex; gap: 14px; align-items: baseline; }
.q .who { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-faint); padding-top: 5px; flex: none; width: 52px; }
.q .text { font-family: var(--font-read); font-size: 25px; font-weight: 500; letter-spacing: -0.015em; color: var(--ink); line-height: 1.3; }

.a { margin-top: 22px; padding-left: 66px; }
.a p { font-family: var(--font-read); font-size: 18.5px; line-height: 1.62; color: var(--ink); margin-bottom: 15px; }
.a p .cite {
  font-family: var(--font-ui); font-size: 11px; font-weight: 600; vertical-align: super;
  color: var(--ochre-text); background: var(--ochre-soft);
  padding: 1px 6px; border-radius: 6px; margin: 0 1px; cursor: pointer; line-height: 1;
}
a strong { font-weight: 600; }

.sources { margin-top: 24px; }
.sources .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-faint); font-weight: 600; margin-bottom: 12px; display:flex; align-items:center; gap: 8px; }
.sources .lbl::after { content:''; flex:1; height:1px; background: var(--border-soft); }
.srcgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.src {
  background: var(--card); border: 1px solid var(--border);
  border-left: 3px solid var(--ochre); border-radius: 12px;
  padding: 14px 16px; text-decoration: none; display: block;
  transition: all 0.2s ease;
}
.src:hover { transform: translateY(-3px); box-shadow: 0 8px 24px oklch(0.3 0.02 250 / 0.1); border-color: var(--ochre); }
.src .num { font-family: var(--font-ui); font-size: 10px; font-weight: 700; color: var(--ochre-text); background: var(--ochre-soft); width: 19px; height: 19px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 9px; }
.src .title { font-family: var(--font-read); font-size: 15.5px; font-weight: 600; color: var(--ink); line-height: 1.3; margin-bottom: 7px; }
.src .meta { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); display: flex; align-items: center; gap: 7px; }
.src .meta .course { color: var(--pine); font-weight: 500; }

.refusal { max-width: 760px; margin: 0 auto 36px; padding-left: 66px; animation: fadeSlideUp 0.35s ease; }
.refusal .q .text { color: var(--ink-soft); }
.refusal .box { margin-top: 20px; background: oklch(0.55 0.15 28 / 0.05); border: 1px solid oklch(0.55 0.15 28 / 0.22); border-radius: 12px; padding: 16px 18px; font-family: var(--font-read); font-size: 17px; color: var(--ink); display:flex; gap: 13px; align-items:flex-start; }
.refusal .box .badge { font-family: var(--font-ui); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--danger); border: 1px solid oklch(0.55 0.15 28 / 0.35); padding: 3px 8px; border-radius: 6px; flex:none; margin-top: 2px; }

/* Composer */
.composer { padding: 16px 40px 26px; border-top: 1px solid var(--border-soft); }
.composer .box {
  max-width: 760px; margin: 0 auto; background: var(--card);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 6px 6px 6px 18px; display: flex; align-items: center; gap: 12px;
  box-shadow: 0 2px 10px oklch(0.3 0.02 250 / 0.04);
  transition: all 0.2s ease;
}
.composer .box:focus-within { border-color: var(--pine); box-shadow: 0 0 0 3px var(--pine-soft); }
.composer input { flex: 1; border: none; outline: none; background: none; font-family: var(--font-ui); font-size: 15px; color: var(--ink); }
.composer input::placeholder { color: var(--ink-faint); }
.composer .send { background: var(--pine); color: var(--paper); border: none; border-radius: 10px; width: 40px; height: 40px; font-size: 17px; cursor: pointer; display:flex; align-items:center; justify-content:center; transition: all 0.2s ease; flex-shrink: 0; }
.composer .send:hover { background: var(--pine-hover); transform: scale(1.05); }
.composer .send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.composer .hint { max-width: 760px; margin: 10px auto 0; font-size: 12px; color: var(--ink-faint); text-align: center; }
.composer .hint code { font-family: var(--font-mono); background: var(--paper-2); padding: 1px 6px; border-radius: 5px; }

/* Study plan */
.study-plan { margin-top: 22px; padding-left: 66px; }
.study-plan .section { margin-bottom: 20px; }
.study-plan .section h3 {
  font-family: var(--font-ui); font-size: 13px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--pine); margin-bottom: 10px; padding-bottom: 6px;
  border-bottom: 2px solid var(--pine-soft);
}
.study-plan .item {
  font-family: var(--font-read); font-size: 16px; line-height: 1.5;
  color: var(--ink); padding: 10px 14px; margin-bottom: 6px;
  background: var(--card); border: 1px solid var(--border-soft);
  border-radius: 10px; border-left: 3px solid var(--ochre);
  transition: all 0.2s ease;
}
.study-plan .item:hover { border-left-color: var(--pine); transform: translateX(4px); }
.study-plan .item .src-label { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); display: block; margin-top: 4px; }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="mark"></div>
      <div>
        <span class="name">Second<b>Brain</b></span>
        <span class="sub">grounded · local</span>
      </div>
    </div>

    <div>
      <h4>Corpus ingerat</h4>
      <nav class="corpus">
        <a class="active" href="#" data-subject="Automatizarea Clădirilor"><span class="dot"></span> Automatizarea Clădirilor <span class="n">28</span></a>
        <a href="#" data-subject="Retelistică"><span class="dot" style="background:var(--ochre)"></span> Retelistică <span class="n">24</span></a>
        <a href="#" data-subject="Tehnologii Web"><span class="dot" style="background:var(--ink-faint)"></span> Tehnologii Web <span class="n">23</span></a>
        <a href="#" data-subject="Sisteme Automate"><span class="dot" style="background:var(--danger)"></span> Sisteme Automate <span class="n">7</span></a>
      </nav>
    </div>

    <div class="actions">
      <button id="planBtn"><span class="ico">📋</span> Plan de învățare</button>
      <button id="formulaBtn"><span class="ico">📝</span> Formule și exerciții</button>
    </div>

    <div class="foot">
      <div><span class="grounded">Ancorat în surse</span></div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="ctx">Interoghezi: <b id="currentSubject">Automatizarea Clădirilor</b> · <span id="subjectCount">0</span> concepte</div>
      <div class="actions">
        <button class="btn btn-outline" id="testBtn">🔌 Test</button>
        <button class="btn btn-primary" id="authBtn">🔑 Login</button>
      </div>
    </div>

    <div class="thread"></div>

    <div class="composer">
      <div class="box">
        <input placeholder="Loghează-te pentru a întreba…">
        <button class="send" disabled>↑</button>
      </div>
      <div class="hint">Fiecare răspuns e ancorat în note. Fără sursă → <code>nu în surse</code>, nu halucinație.</div>
    </div>
  </main>
</div>

<script>
// ========== CONFIG ==========
const SUPABASE_URL = 'https://ghykfsupezjigjcoriku.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_2DQeuvl11MIqDU3d3Jweag_XMpIzhnW';

window.supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ========== DOM ==========
const thread = document.querySelector('.thread');
const input = document.querySelector('.composer input');
const sendBtn = document.querySelector('.send');
const authBtn = document.getElementById('authBtn');
const testBtn = document.getElementById('testBtn');
const planBtn = document.getElementById('planBtn');
const formulaBtn = document.getElementById('formulaBtn');

// ========== STATE ==========
let currentUser = null;
let welcomeShown = false;
let activeSubject = 'Automatizarea Clădirilor';

// ========== UTILITY ==========
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function addTurn(question, answerHtml, sources) {
  const turn = document.createElement('div');
  turn.className = 'turn';
  turn.innerHTML = `
    <div class="q">
      <div class="who">Tu</div>
      <div class="text">${escapeHtml(question)}</div>
    </div>
    <div class="a">
      ${answerHtml}
      ${buildSourceCards(sources)}
    </div>
  `;
  thread.appendChild(turn);
  setTimeout(() => thread.scrollTop = thread.scrollHeight, 50);
}

function addRefusal(question, message) {
  const turn = document.createElement('div');
  turn.className = 'turn refusal';
  turn.innerHTML = `
    <div class="q">
      <div class="who">Tu</div>
      <div class="text">${escapeHtml(question)}</div>
    </div>
    <div class="a">
      <div class="box">
        <span class="badge">Nu în surse</span>
        <span>${escapeHtml(message)}</span>
      </div>
    </div>
  `;
  thread.appendChild(turn);
  setTimeout(() => thread.scrollTop = thread.scrollHeight, 50);
}

function addSystemMessage(text) {
  const msg = document.createElement('div');
  msg.style.textAlign = 'center';
  msg.style.margin = '20px 0';
  msg.style.padding = '12px';
  msg.style.background = 'var(--pine-soft)';
  msg.style.borderRadius = 'var(--radius)';
  msg.style.color = 'var(--pine)';
  msg.style.fontSize = '14px';
  msg.style.animation = 'fadeSlideUp 0.3s ease';
  msg.textContent = text;
  thread.appendChild(msg);
  setTimeout(() => thread.scrollTop = thread.scrollHeight, 50);
}

function buildSourceCards(sources) {
  if (!sources || sources.length === 0) return '';
  return `
    <div class="sources">
      <div class="lbl">Surse</div>
      <div class="srcgrid">
        ${sources.map((src, i) => `
          <a class="src" href="#" data-id="${src.id}">
            <span class="num">${i + 1}</span>
            <div class="title">${escapeHtml(src.title)}</div>
            <div class="meta"><span class="course">${escapeHtml(src.materii?.[0] || 'Necunoscut')}</span> · <span>${escapeHtml(src.source || '')}</span></div>
          </a>
        `).join('')}
      </div>
    </div>
  `;
}

// ========== AUTH ==========
async function checkAuth() {
  try {
    const { data: { session } } = await window.supabase.auth.getSession();
    currentUser = session?.user ?? null;
    if (currentUser) {
      authBtn.innerHTML = '🚪 Logout';
      authBtn.className = 'btn btn-outline';
      input.placeholder = `Autentificat ca ${currentUser.email}...`;
      input.disabled = false;
      sendBtn.disabled = false;
    } else {
      authBtn.innerHTML = '🔑 Login';
      authBtn.className = 'btn btn-primary';
      input.placeholder = 'Loghează-te pentru a întreba…';
      input.disabled = true;
      sendBtn.disabled = true;
    }
  } catch (_) {
    authBtn.innerHTML = '🔑 Login';
    authBtn.className = 'btn btn-sm btn-primary';
    input.placeholder = 'Loghează-te pentru a întreba…';
    input.disabled = true;
    sendBtn.disabled = true;
  }
}

// ========== SEARCH ==========
function extractKeywords(query) {
  const stopWords = ['este','sunt','oare','care','ce','cum','unde','cand','cat','cine',
    'al','ale','ai','la','lui','prin','din','dupa','fara','catre','contra','pana','pentru',
    'sub','peste','intre','spre','pe','cu','de','si','dar','iar','ori','ca','mai','ma','te',
    'se','ne','va','imi','iti','un','o','una','niste','acest','aceasta','acel','aceea','alt',
    'alta','alti','alte','are','au','era','fost','vor','vom','atunci','acolo','aici','asa',
    'doar','prea','cam','aproape','chiar','tot','toate','putin','mult','multe','multi','unele',
    'cativa','cateva','ceva','nimic','cei','cel','cele','trebuie','poate','pot','putem','puteti',
    'face','fac','fie','fi','fii','fiti','sunteti','suntem','erau','fusesera','fusesem'];
  return [...new Set(query.toLowerCase()
    .replace(/[?.,!;:""„”«»()\-/\\']/g, ' ')
    .split(/\s+/)
    .filter(w => w.length > 2 && !stopWords.includes(w)))];
}

async function searchConcepts(query) {
  const keywords = extractKeywords(query);
  if (keywords.length === 0) return [];
  const conditions = keywords.map(k => `title.ilike.%${k}%,description.ilike.%${k}%`).join(',');
  let q = window.supabase.from('concepts').select('*').or(conditions).limit(8);
  if (activeSubject) q = q.contains('materii', [activeSubject]);
  const { data, error } = await q;
  if (error) throw error;
  data.sort((a, b) => {
    const score = t => keywords.filter(k => t.title.toLowerCase().includes(k) || t.description.toLowerCase().includes(k)).length;
    return score(b) - score(a);
  });
  return data.slice(0, 5);
}

function generateAnswer(question, results) {
  if (!results || results.length === 0) {
    return { html: '<p>Nu am găsit informații relevante în baza de cunoștințe pentru această întrebare.</p>', sources: [], refusal: true };
  }
  return {
    html: `<p>${results.map((r, i) => `${escapeHtml(r.description)}<span class="cite">${i + 1}</span>`).join(' ')}</p>`,
    sources: results.map(r => ({ id: r.id, title: r.title, materii: r.materii, source: r.source })),
    refusal: false
  };
}

// ========== STUDY PLAN ==========
async function generateStudyPlan() {
  addSystemMessage(`Se generează planul de învățare pentru ${activeSubject}…`);
  try {
    let q = window.supabase.from('concepts').select('*');
    if (activeSubject) q = q.contains('materii', [activeSubject]);
    const { data, error } = await q;
    if (error) throw error;

    const sourceOrder = [];
    const groups = {};
    for (const c of data) {
      const key = c.source || 'General';
      if (!groups[key]) { groups[key] = []; sourceOrder.push(key); }
      groups[key].push(c);
    }

    let html = '<div class="study-plan">';
    html += `<p style="font-family:var(--font-read);font-size:20px;font-weight:600;color:var(--pine);margin-bottom:6px">📋 Plan de învățare — ${escapeHtml(activeSubject)}</p>`;
    html += `<p style="font-family:var(--font-read);font-size:15px;color:var(--ink-soft);margin-bottom:22px">${data.length} concepte grupate pe cursuri/surse. Parcurge în ordinea listată.</p>`;

    for (const source of sourceOrder) {
      const items = groups[source];
      const shortSource = source.replace(/\.pdf$/,'').replace(/^C\d+[- ]*/,'').replace(/^RC_/,'');
      html += `<div class="section"><h3>📄 ${escapeHtml(shortSource || 'General')} — ${items.length}</h3>`;
      for (const item of items) {
        const badge = item.type !== 'definition' ? `<span style="font-family:var(--font-mono);font-size:10px;color:var(--ochre-text);background:var(--ochre-soft);padding:1px 6px;border-radius:4px;margin-right:6px">${item.type}</span>` : '';
        html += `<div class="item">${badge}${escapeHtml(item.description || item.title)}<span class="src-label">${escapeHtml(item.title)}</span></div>`;
      }
      html += '</div>';
    }
    html += '</div>';

    const turn = document.createElement('div');
    turn.className = 'turn';
    turn.innerHTML = `<div class="q"><div class="who">Tu</div><div class="text">Arată-mi planul de învățare pentru ${escapeHtml(activeSubject)}</div></div>${html}`;
    thread.appendChild(turn);
  } catch (err) {
    addSystemMessage('Eroare la generarea planului: ' + err.message);
  }
  setTimeout(() => thread.scrollTop = thread.scrollHeight, 50);
}

// ========== FORMULAS PLAN ==========
async function generateFormulasPlan() {
  addSystemMessage(`Se generează planul de formule/exerciții pentru ${activeSubject}…`);
  try {
    let q = window.supabase.from('concepts').select('*').in('type', ['formula', 'algorithm', 'example']);
    if (activeSubject) q = q.contains('materii', [activeSubject]);
    const { data, error } = await q;
    if (error) throw error;
    if (data.length === 0) {
      addSystemMessage('Nicio formulă, algoritm sau exemplu găsit pentru această materie.');
      return;
    }

    const sourceOrder = [];
    const groups = {};
    for (const c of data) {
      const key = c.source || 'General';
      if (!groups[key]) { groups[key] = []; sourceOrder.push(key); }
      groups[key].push(c);
    }

    let html = '<div class="study-plan">';
    html += `<p style="font-family:var(--font-read);font-size:20px;font-weight:600;color:var(--pine);margin-bottom:6px">📝 Formule și exerciții — ${escapeHtml(activeSubject)}</p>`;
    html += `<p style="font-family:var(--font-read);font-size:15px;color:var(--ink-soft);margin-bottom:22px">${data.length} formule/algoritmi/exemple. Rezolvă-le în ordinea capitolelor.</p>`;

    for (const source of sourceOrder) {
      const items = groups[source];
      const shortSource = source.replace(/\.pdf$/,'').replace(/^C\d+[- ]*/,'').replace(/^RC_/,'');
      html += `<div class="section"><h3>📄 ${escapeHtml(shortSource || 'General')} — ${items.length}</h3>`;
      for (const item of items) {
        const badge = `<span style="font-family:var(--font-mono);font-size:10px;color:var(--ochre-text);background:var(--ochre-soft);padding:1px 6px;border-radius:4px;margin-right:6px">${item.type}</span>`;
        html += `<div class="item">${badge}${escapeHtml(item.description || item.title)}<span class="src-label">${escapeHtml(item.title)}</span></div>`;
      }
      html += '</div>';
    }
    html += '</div>';

    const turn = document.createElement('div');
    turn.className = 'turn';
    turn.innerHTML = `<div class="q"><div class="who">Tu</div><div class="text">Arată-mi formulele și exercițiile pentru ${escapeHtml(activeSubject)}</div></div>${html}`;
    thread.appendChild(turn);
  } catch (err) {
    addSystemMessage('Eroare la generarea planului: ' + err.message);
  }
  setTimeout(() => thread.scrollTop = thread.scrollHeight, 50);
}

// ========== EVENTS ==========
document.querySelectorAll('.corpus a').forEach(link => {
  link.addEventListener('click', (e) => {
    e.preventDefault();
    document.querySelectorAll('.corpus a').forEach(a => a.classList.remove('active'));
    link.classList.add('active');
    activeSubject = link.dataset.subject;
    document.getElementById('currentSubject').textContent = activeSubject;
  });
});

planBtn.addEventListener('click', generateStudyPlan);
formulaBtn.addEventListener('click', generateFormulasPlan);

testBtn.addEventListener('click', async () => {
  testBtn.disabled = true;
  testBtn.textContent = '⏳';
  try {
    const { data, error } = await window.supabase.from('concepts').select('id').limit(1);
    if (error) throw error;
    addSystemMessage(`✅ Conexiune reușită! ${data.length} concept(e) în db.`);
  } catch (err) {
    addSystemMessage(`❌ Eroare: ${err.message}`);
  }
  testBtn.innerHTML = '🔌 Test';
  testBtn.disabled = false;
});

authBtn.addEventListener('click', async () => {
  authBtn.disabled = true;
  try {
    const { data: { session } } = await window.supabase.auth.getSession();
    if (session) {
      await window.supabase.auth.signOut();
    } else {
      await window.supabase.auth.signInWithOAuth({ provider: 'github', options: { redirectTo: window.location.origin } });
    }
  } catch (err) {
    addSystemMessage('Eroare autentificare: ' + err.message);
  }
  authBtn.disabled = false;
});

sendBtn.addEventListener('click', async () => {
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  input.disabled = true;
  sendBtn.disabled = true;
  sendBtn.textContent = '⏳';
  try {
    const results = await searchConcepts(q);
    const { html, sources, refusal } = generateAnswer(q, results);
    refusal ? addRefusal(q, 'Nu am găsit informații relevante în baza de cunoștințe pentru această întrebare.') : addTurn(q, html, sources);
  } catch (err) {
    addRefusal(q, 'Eroare la căutare: ' + err.message);
  }
  input.disabled = false;
  sendBtn.disabled = false;
  sendBtn.textContent = '↑';
  input.focus();
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendBtn.click();
});

window.supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && !welcomeShown) {
    welcomeShown = true;
    addSystemMessage(`Bine ai venit, ${session.user.email}`);
    checkAuth();
  } else if (event === 'SIGNED_OUT') {
    welcomeShown = false;
    addSystemMessage('Deconectat.');
    checkAuth();
  }
});

checkAuth();
</script>
</body>
</html>
